<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM Horizon 2035 — Schéma directeur</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='18' fill='%23D86F6F'/><path d='M24,32C16.3,32 10,25.7 10,18C10,10.3 16.3,4 24,4L24,8.5C18.8,8.5 14.5,12.8 14.5,18C14.5,23.2 18.8,27.5 24,27.5L24,32' fill='white'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body, #root { height: 100%; }
        body { font-family: 'Roboto', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        button { font-family: inherit; }
        input:focus { border-color: #D86F6F !important; outline: none; }
        a { text-decoration: none; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E8DEDD; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D86F6F; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <script type="text/babel">
const { useState, useRef, useEffect } = React;

const C = {
  corail: "#D86F6F", noir: "#1D1D1B", rose: "#E372A6",
  fondClair: "#F9F5F4", fondRose: "#FDF0EE", white: "#FFFFFF",
  text: "#2C2C2C", muted: "#8A7F7F", border: "#E8DEDD",
  green: "#5BA67D", amber: "#D4A843", steel: "#6B7F94",
  violet: "#7C6BAA", blue: "#4A90B8", red: "#C0392B",
};

const PASSWORD = "CPM2035";

const pages = [
  { id: "home", label: "Accueil", icon: "🏠", category: null },
  { id: "synthese", label: "Synthèse du cadrage", icon: "📋", category: "SCHÉMA DIRECTEUR" },
  { id: "architecture", label: "Architecture technique", icon: "🏗️", category: null },
  { id: "roadmap", label: "Roadmap 2035", icon: "🗺️", category: null },
  { id: "presentation", label: "Présentation COPIL", icon: "📊", category: null },
  { id: "prototype", label: "Gestion des tentes", icon: "⛺", category: "OUTILS OPÉRATIONNELS" },
  { id: "inspection", label: "Inspection IA", icon: "👁️", category: null },
  { id: "passeport", label: "Passeport numérique", icon: "🎫", category: null },
  { id: "assistant", label: "Demande au CPM", icon: "🤖", category: null },
  { id: "analyse", label: "Analyse SAP 2025", icon: "📈", category: "DATA & PRÉDICTION" },
  { id: "meteo", label: "Météo du patrimoine", icon: "⛅", category: null },
  { id: "prediction", label: "Prédiction saisonnière", icon: "🔮", category: null },
  { id: "innovation", label: "Le modèle CPM", icon: "💎", category: "COMMUNICATION" },
];

const homeCards = [
  { title: "Schéma directeur", desc: "Vision, architecture, roadmap et présentation COPIL", icon: "📋", color: C.corail, links: ["synthese", "architecture", "roadmap", "presentation"], count: 4 },
  { title: "Outils opérationnels", desc: "Prototype tentes, inspection IA, passeport QR et assistant", icon: "⛺", color: C.green, links: ["prototype", "inspection", "passeport", "assistant"], count: 4 },
  { title: "Data & Prédiction", desc: "Analyse SAP, météo du patrimoine et prédiction saisonnière", icon: "📈", color: C.violet, links: ["analyse", "meteo", "prediction"], count: 3 },
  { title: "Communication", desc: "Le modèle CPM — positionnement innovation publique", icon: "💎", color: C.amber, links: ["innovation"], count: 1 },
];

const stats = [
  { num: "2 277", label: "tentes au parc", color: C.corail },
  { num: "1 003 839", label: "participants servis", color: C.green },
  { num: "12", label: "modules produits", color: C.violet },
  { num: "2035", label: "horizon du projet", color: C.amber },
];

// Login Screen
function LoginScreen({ onLogin }) {
  const [pwd, setPwd] = useState("");
  const [error, setError] = useState(false);
  const [shake, setShake] = useState(false);

  const handleSubmit = () => {
    if (pwd === PASSWORD) {
      onLogin();
    } else {
      setError(true);
      setShake(true);
      setTimeout(() => setShake(false), 500);
    }
  };

  return (
    <div style={{
      minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center",
      background: `linear-gradient(135deg, ${C.noir} 0%, #2C3E50 60%, ${C.corail}40 100%)`,
      fontFamily: "'Roboto', system-ui, sans-serif",
    }}>
      <div style={{
        background: C.white, borderRadius: 20, padding: "48px 40px", width: 400,
        textAlign: "center", boxShadow: "0 20px 60px rgba(0,0,0,0.3)",
        animation: shake ? "shake 0.4s ease" : "none",
      }}>
        <style>{`@keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }`}</style>

        {/* Pastille */}
        <div style={{
          width: 70, height: 70, borderRadius: "50%", background: C.corail,
          margin: "0 auto 20px", display: "flex", alignItems: "center", justifyContent: "center",
        }}>
          <svg viewBox="0 0 40 40" width="36" height="36">
            <path d="M24,32C16.3,32 10,25.7 10,18C10,10.3 16.3,4 24,4L24,8.5C18.8,8.5 14.5,12.8 14.5,18C14.5,23.2 18.8,27.5 24,27.5L24,32" fill="white" />
          </svg>
        </div>

        <h1 style={{ fontSize: 26, fontWeight: 700, fontFamily: "'Poppins', sans-serif", color: C.noir, margin: "0 0 4px" }}>
          CPM Horizon 2035
        </h1>
        <p style={{ fontSize: 14, color: C.muted, marginBottom: 6 }}>
          Transmettre un patrimoine. Ensemble.
        </p>
        <p style={{ fontSize: 12, color: C.border, marginBottom: 28 }}>
          Fédération Wallonie-Bruxelles · Administration générale de la Culture
        </p>

        <div style={{ marginBottom: 16 }}>
          <input
            type="password"
            value={pwd}
            onChange={e => { setPwd(e.target.value); setError(false); }}
            onKeyDown={e => e.key === "Enter" && handleSubmit()}
            placeholder="Code d'accès"
            style={{
              width: "100%", padding: "14px 18px", borderRadius: 12,
              border: `2px solid ${error ? C.red : C.border}`,
              fontSize: 16, textAlign: "center", outline: "none",
              fontFamily: "'Roboto', sans-serif", letterSpacing: 4,
              background: C.fondClair,
              transition: "border-color 0.2s",
            }}
          />
        </div>

        <button onClick={handleSubmit} style={{
          width: "100%", padding: "14px", borderRadius: 12, border: "none",
          background: C.corail, color: "#fff", fontSize: 16, fontWeight: 700,
          cursor: "pointer", fontFamily: "'Poppins', sans-serif",
          transition: "opacity 0.2s",
        }}>
          Accéder au schéma directeur
        </button>

        {error && (
          <p style={{ fontSize: 13, color: C.red, marginTop: 12, fontWeight: 600 }}>
            Code incorrect. Veuillez réessayer.
          </p>
        )}
      </div>
    </div>
  );
}

// Home Dashboard
function HomePage({ onNavigate }) {
  return (
    <div>
      {/* Hero */}
      <div style={{
        background: `linear-gradient(135deg, ${C.noir} 0%, #2C3E50 100%)`,
        borderRadius: 16, padding: "32px 28px", color: "#fff", marginBottom: 20,
      }}>
        <div style={{ fontSize: 12, textTransform: "uppercase", letterSpacing: 2, opacity: 0.6, marginBottom: 8 }}>
          Schéma directeur de transformation numérique
        </div>
        <h1 style={{ fontSize: 32, fontWeight: 700, fontFamily: "'Poppins', sans-serif", margin: "0 0 6px" }}>
          <span style={{ fontWeight: 300 }}>CPM</span> Horizon 2035
        </h1>
        <p style={{ fontSize: 16, opacity: 0.8, fontStyle: "italic", margin: "0 0 20px" }}>
          « Ils ne savaient pas que c'était impossible alors ils l'ont fait. »
        </p>

        <div style={{ display: "flex", gap: 12 }}>
          {stats.map((s, i) => (
            <div key={i} style={{ flex: 1, background: "rgba(255,255,255,0.08)", borderRadius: 10, padding: "12px 14px" }}>
              <div style={{ fontSize: 22, fontWeight: 800, color: s.color, fontFamily: "'Poppins', sans-serif" }}>{s.num}</div>
              <div style={{ fontSize: 11, opacity: 0.7 }}>{s.label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Module cards */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {homeCards.map((card, i) => (
          <div key={i} onClick={() => onNavigate(card.links[0])} style={{
            background: C.white, borderRadius: 14, padding: 22,
            border: `1px solid ${C.border}`, cursor: "pointer",
            transition: "all 0.2s", borderLeft: `4px solid ${card.color}`,
          }}
          onMouseOver={e => e.currentTarget.style.boxShadow = `0 4px 16px ${card.color}20`}
          onMouseOut={e => e.currentTarget.style.boxShadow = "none"}
          >
            <div style={{ fontSize: 32, marginBottom: 10 }}>{card.icon}</div>
            <div style={{ fontSize: 18, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 6 }}>{card.title}</div>
            <div style={{ fontSize: 14, color: C.muted, lineHeight: 1.6, marginBottom: 12 }}>{card.desc}</div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: card.color }}>{card.count} module{card.count > 1 ? "s" : ""}</span>
              <span style={{ fontSize: 14, color: card.color }}>→</span>
            </div>
          </div>
        ))}
      </div>

      {/* Quick access */}
      <div style={{ marginTop: 20, background: C.fondRose, borderRadius: 14, padding: 22 }}>
        <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 12 }}>
          Accès rapide
        </div>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {pages.filter(p => p.id !== "home").map(p => (
            <button key={p.id} onClick={() => onNavigate(p.id)} style={{
              padding: "8px 16px", borderRadius: 20, border: `1px solid ${C.border}`,
              background: C.white, cursor: "pointer", fontSize: 13, fontWeight: 500,
              display: "flex", alignItems: "center", gap: 6,
            }}
            onMouseOver={e => { e.currentTarget.style.borderColor = C.corail; e.currentTarget.style.color = C.corail; }}
            onMouseOut={e => { e.currentTarget.style.borderColor = C.border; e.currentTarget.style.color = C.text; }}
            >
              <span>{p.icon}</span> {p.label}
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

// Module placeholder — shows iframe or message
function ModulePage({ page }) {
  const fileMap = {
    synthese: { file: "CPM_Horizon_2035_Synthese_Cadrage.html", title: "Synthèse du cadrage" },
    architecture: { file: "CPM_Horizon_2035_Architecture.html", title: "Architecture technique" },
    roadmap: { file: "CPM_Horizon_2035_Roadmap.html", title: "Roadmap 2035" },
    prototype: { file: "CPM_Prototype_Gestion_Tentes.html", title: "Prototype gestion des tentes" },
    analyse: { file: "CPM_Analyse_SAP_2025.html", title: "Analyse SAP 2025" },
    meteo: { file: "CPM_Meteo_du_Patrimoine.html", title: "Météo du patrimoine" },
    prediction: { file: "CPM_Prediction_Saisonniere.html", title: "Prédiction saisonnière" },
    passeport: { file: "CPM_Passeport_Numerique_Tente.html", title: "Passeport numérique" },
    assistant: { file: "CPM_Assistant_IA_Demande_au_CPM.html", title: "Demande au CPM" },
  };

  const mapping = fileMap[page.id];

  if (page.id === "presentation") {
    return (
      <div style={{ background: C.white, borderRadius: 14, padding: 28, border: `1px solid ${C.border}`, textAlign: "center" }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>📊</div>
        <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 8 }}>Présentation COPIL</div>
        <div style={{ fontSize: 15, color: C.muted, marginBottom: 20 }}>14 slides aux couleurs AGC · Format PowerPoint</div>
        <a href="CPM_Horizon_2035_Presentation_COPIL.pptx" download style={{
          display: "inline-block", padding: "14px 28px", borderRadius: 12,
          background: C.corail, color: "#fff", fontSize: 16, fontWeight: 700,
          textDecoration: "none", fontFamily: "'Poppins', sans-serif",
        }}>Télécharger le PPTX</a>
      </div>
    );
  }

  if (page.id === "innovation") {
    return (
      <div style={{ background: C.white, borderRadius: 14, padding: 28, border: `1px solid ${C.border}`, textAlign: "center" }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>💎</div>
        <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 8 }}>Le modèle CPM — Innovation publique</div>
        <div style={{ fontSize: 15, color: C.muted, marginBottom: 20 }}>Document de positionnement · Format Markdown</div>
        <a href="CPM_Le_Modele_CPM_Innovation_Publique.md" download style={{
          display: "inline-block", padding: "14px 28px", borderRadius: 12,
          background: C.violet, color: "#fff", fontSize: 16, fontWeight: 700,
          textDecoration: "none", fontFamily: "'Poppins', sans-serif",
        }}>Télécharger le document</a>
      </div>
    );
  }

  if (page.id === "inspection") {
    return (
      <div style={{ background: C.white, borderRadius: 14, padding: 28, border: `1px solid ${C.border}`, textAlign: "center" }}>
        <div style={{ fontSize: 48, marginBottom: 16 }}>👁️</div>
        <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 8 }}>Module d'inspection IA</div>
        <div style={{ fontSize: 15, color: C.muted, marginBottom: 20 }}>Intégré dans le prototype de gestion des tentes — onglet "Inspection IA"</div>
        <div style={{ padding: "12px 20px", borderRadius: 10, background: C.fondRose, fontSize: 14, color: C.corail, fontWeight: 600, display: "inline-block" }}>
          Accédez-y via le module "Gestion des tentes"
        </div>
      </div>
    );
  }

  if (mapping) {
    return (
      <div>
        <div style={{
          background: C.white, borderRadius: 14, border: `1px solid ${C.border}`,
          overflow: "hidden", height: "calc(100vh - 160px)",
        }}>
          <iframe
            src={mapping.file}
            style={{ width: "100%", height: "100%", border: "none" }}
            title={mapping.title}
          />
        </div>
        <div style={{ marginTop: 8, textAlign: "center" }}>
          <a href={mapping.file} target="_blank" rel="noreferrer" style={{
            fontSize: 13, color: C.corail, fontWeight: 600, textDecoration: "none",
          }}>Ouvrir dans un nouvel onglet ↗</a>
        </div>
      </div>
    );
  }

  return <div style={{ padding: 40, textAlign: "center", color: C.muted }}>Module en construction</div>;
}

// Main App
function CPMApp() {
  const [authenticated, setAuthenticated] = useState(false);
  const [activePage, setActivePage] = useState("home");
  const [sidebarOpen, setSidebarOpen] = useState(true);

  if (!authenticated) {
    return <LoginScreen onLogin={() => setAuthenticated(true)} />;
  }

  const currentPage = pages.find(p => p.id === activePage);

  return (
    <div style={{ fontFamily: "'Roboto',system-ui,sans-serif", display: "flex", minHeight: "100vh", background: C.fondClair }}>
      {/* Sidebar */}
      <div style={{
        width: sidebarOpen ? 260 : 60, background: C.white, borderRight: `1px solid ${C.border}`,
        transition: "width 0.3s ease", flexShrink: 0, overflow: "hidden",
        display: "flex", flexDirection: "column",
      }}>
        {/* Logo area */}
        <div style={{
          padding: sidebarOpen ? "20px 18px" : "20px 10px", borderBottom: `1px solid ${C.border}`,
          display: "flex", alignItems: "center", gap: 10,
        }}>
          <div style={{
            width: 36, height: 36, borderRadius: "50%", background: C.corail, flexShrink: 0,
            display: "flex", alignItems: "center", justifyContent: "center",
          }}>
            <svg viewBox="0 0 40 40" width="20" height="20">
              <path d="M24,32C16.3,32 10,25.7 10,18C10,10.3 16.3,4 24,4L24,8.5C18.8,8.5 14.5,12.8 14.5,18C14.5,23.2 18.8,27.5 24,27.5L24,32" fill="white" />
            </svg>
          </div>
          {sidebarOpen && (
            <div>
              <div style={{ fontSize: 15, fontWeight: 700, fontFamily: "'Poppins', sans-serif", color: C.noir }}>CPM 2035</div>
              <div style={{ fontSize: 10, color: C.muted }}>Schéma directeur</div>
            </div>
          )}
        </div>

        {/* Navigation */}
        <div style={{ flex: 1, padding: "10px 8px", overflowY: "auto" }}>
          {pages.map((page, i) => {
            const showCategory = sidebarOpen && page.category;
            return (
              <div key={page.id}>
                {showCategory && (
                  <div style={{
                    fontSize: 10, fontWeight: 700, color: C.muted, textTransform: "uppercase",
                    letterSpacing: 1, padding: "12px 10px 4px", marginTop: i > 0 ? 8 : 0,
                  }}>{page.category}</div>
                )}
                <button onClick={() => setActivePage(page.id)} style={{
                  width: "100%", display: "flex", alignItems: "center", gap: 10,
                  padding: sidebarOpen ? "10px 12px" : "10px 0",
                  justifyContent: sidebarOpen ? "flex-start" : "center",
                  borderRadius: 10, border: "none", cursor: "pointer",
                  background: activePage === page.id ? C.corail + "12" : "transparent",
                  color: activePage === page.id ? C.corail : C.text,
                  fontSize: 14, fontWeight: activePage === page.id ? 700 : 500,
                  transition: "all 0.15s",
                }}
                onMouseOver={e => { if (activePage !== page.id) e.currentTarget.style.background = C.fondRose; }}
                onMouseOut={e => { if (activePage !== page.id) e.currentTarget.style.background = "transparent"; }}
                >
                  <span style={{ fontSize: 18, flexShrink: 0 }}>{page.icon}</span>
                  {sidebarOpen && <span>{page.label}</span>}
                </button>
              </div>
            );
          })}
        </div>

        {/* Toggle + Logout */}
        <div style={{ padding: "10px 8px", borderTop: `1px solid ${C.border}` }}>
          <button onClick={() => setSidebarOpen(!sidebarOpen)} style={{
            width: "100%", padding: "8px", borderRadius: 8, border: `1px solid ${C.border}`,
            background: C.fondClair, cursor: "pointer", fontSize: 12, color: C.muted,
            marginBottom: 6, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
          }}>
            {sidebarOpen ? "◀ Réduire" : "▶"}
          </button>
          <button onClick={() => setAuthenticated(false)} style={{
            width: "100%", padding: "8px", borderRadius: 8, border: "none",
            background: C.red + "10", cursor: "pointer", fontSize: 12, color: C.red,
            fontWeight: 600, display: "flex", alignItems: "center", justifyContent: "center", gap: 6,
          }}>
            {sidebarOpen ? "🔒 Déconnexion" : "🔒"}
          </button>
        </div>
      </div>

      {/* Main content */}
      <div style={{ flex: 1, display: "flex", flexDirection: "column", minWidth: 0 }}>
        {/* Top bar */}
        <div style={{
          padding: "14px 24px", background: C.white, borderBottom: `1px solid ${C.border}`,
          display: "flex", justifyContent: "space-between", alignItems: "center",
        }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 700, fontFamily: "'Poppins', sans-serif", color: C.noir }}>
              {currentPage?.icon} {currentPage?.label}
            </div>
          </div>
          <div style={{ fontSize: 12, color: C.muted }}>
            Centre de Prêt de Matériel · FWB
          </div>
        </div>

        {/* Content */}
        <div style={{ flex: 1, padding: "20px 24px", overflowY: "auto" }}>
          {activePage === "home" ? (
            <HomePage onNavigate={setActivePage} />
          ) : (
            <ModulePage page={currentPage} />
          )}
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(CPMApp));
    </script>
</body>
</html>
