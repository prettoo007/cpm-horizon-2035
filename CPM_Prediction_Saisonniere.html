<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM — Analyse prédictive saisonnière</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
        button { font-family: inherit; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <script type="text/babel">
const { useState } = React;

const C = {
  corail: "#D86F6F", noir: "#1D1D1B", rose: "#E372A6",
  fondClair: "#F9F5F4", fondRose: "#FDF0EE", white: "#FFFFFF",
  text: "#2C2C2C", muted: "#8A7F7F", border: "#E8DEDD",
  green: "#5BA67D", amber: "#D4A843", steel: "#6B7F94",
  violet: "#7C6BAA", blue: "#4A90B8", red: "#C0392B",
};

// Real 2025 data + projected 2026/2027
const seasonData = [
  { mois: "Jan", prets2025: 54, pannes2025: 18, prets2026: 58, pannes2026: 15 },
  { mois: "Fév", prets2025: 118, pannes2025: 64, prets2026: 125, pannes2026: 55 },
  { mois: "Mar", prets2025: 196, pannes2025: 146, prets2026: 210, pannes2026: 130 },
  { mois: "Avr", prets2025: 292, pannes2025: 254, prets2026: 315, pannes2026: 220 },
  { mois: "Mai", prets2025: 315, pannes2025: 119, prets2026: 338, pannes2026: 105 },
  { mois: "Juin", prets2025: 319, pannes2025: 136, prets2026: 340, pannes2026: 120 },
  { mois: "Juil", prets2025: 646, pannes2025: 149, prets2026: 690, pannes2026: 140 },
  { mois: "Août", prets2025: 134, pannes2025: 107, prets2026: 145, pannes2026: 95 },
  { mois: "Sept", prets2025: 257, pannes2025: 174, prets2026: 275, pannes2026: 155 },
  { mois: "Oct", prets2025: 223, pannes2025: 80, prets2026: 240, pannes2026: 70 },
  { mois: "Nov", prets2025: 170, pannes2025: 40, prets2026: 182, pannes2026: 35 },
  { mois: "Déc", prets2025: 145, pannes2025: 28, prets2026: 155, pannes2026: 25 },
];

const totalPrets2025 = seasonData.reduce((s, d) => s + d.prets2025, 0);
const totalPrets2026 = seasonData.reduce((s, d) => s + d.prets2026, 0);
const growth = Math.round(((totalPrets2026 - totalPrets2025) / totalPrets2025) * 100);

const capacityAnalysis = [
  { mois: "Jan", demande: 58, capacite: 200, taux: 29 },
  { mois: "Fév", demande: 125, capacite: 200, taux: 63 },
  { mois: "Mar", demande: 210, capacite: 200, taux: 105 },
  { mois: "Avr", demande: 315, capacite: 200, taux: 158 },
  { mois: "Mai", demande: 338, capacite: 200, taux: 169 },
  { mois: "Juin", demande: 340, capacite: 250, taux: 136 },
  { mois: "Juil", demande: 690, capacite: 300, taux: 230 },
  { mois: "Août", demande: 145, capacite: 300, taux: 48 },
  { mois: "Sept", demande: 275, capacite: 250, taux: 110 },
  { mois: "Oct", demande: 240, capacite: 200, taux: 120 },
  { mois: "Nov", demande: 182, capacite: 200, taux: 91 },
  { mois: "Déc", demande: 155, capacite: 200, taux: 78 },
];

const fatiguePrediction = [
  { categorie: "A — Excellent (0-1 réparation)", tentes: 1420, pct: 62, color: C.green, action: "Maintien en service" },
  { categorie: "B — Bon (2 réparations)", tentes: 524, pct: 23, color: C.amber, action: "Surveillance normale" },
  { categorie: "C — Fatigué (3-4 réparations)", tentes: 268, pct: 12, color: C.corail, action: "Surveillance renforcée" },
  { categorie: "D — Critique (5+ réparations)", tentes: 65, pct: 3, color: C.red, action: "Déclassement à planifier" },
];

const replacementPlan = [
  { annee: "2027", senior: 25, junior: 5, total: 30, motif: "Tentes D (5+ réparations) + usure toile irréversible" },
  { annee: "2028", senior: 35, junior: 8, total: 43, motif: "Tentes C passées en D + vieillissement lot toile 2012-2014" },
  { annee: "2029", senior: 40, junior: 10, total: 50, motif: "Renouvellement lot toile 2015 + augmentation demande prévue" },
  { annee: "2030", senior: 30, junior: 12, total: 42, motif: "Rythme de croisière — remplacement préventif" },
];

const views = [
  { id: "saison", label: "Prévision saisonnière", icon: "📅" },
  { id: "capacite", label: "Capacité vs Demande", icon: "⚖️" },
  { id: "fatigue", label: "Prédiction de fatigue", icon: "🔮" },
  { id: "remplacement", label: "Plan de remplacement", icon: "🔄" },
];

function Bar({ value, max, color, height }) {
  return (
    <div style={{ width: "100%", height: height || 6, background: C.border, borderRadius: 3, overflow: "hidden" }}>
      <div style={{ width: `${Math.min((value / max) * 100, 100)}%`, height: "100%", background: color, borderRadius: 3, transition: "width 0.5s" }} />
    </div>
  );
}

function VerticalBars({ data, valKey, maxVal, color, labelKey, compareKey, compareColor }) {
  const mx = maxVal || Math.max(...data.map(d => Math.max(d[valKey], compareKey ? (d[compareKey] || 0) : 0)));
  return (
    <div>
      <div style={{ display: "flex", gap: 4, height: 220 }}>
        {data.map((d, i) => {
          const v1 = d[valKey];
          const v2 = compareKey ? d[compareKey] : null;
          const h1 = Math.max((v1 / mx) * 190, 4);
          const h2 = v2 ? Math.max((v2 / mx) * 190, 4) : 0;
          return (
            <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end" }}>
              <span style={{ fontSize: 10, fontWeight: 700, color: color, marginBottom: 4 }}>{v1}</span>
              <div style={{ display: "flex", gap: 2, alignItems: "flex-end", width: "100%" }}>
                <div style={{ flex: 1, height: h1, background: color, borderRadius: "4px 4px 0 0" }} />
                {v2 !== null && (
                  <div style={{ flex: 1, height: h2, background: compareColor || C.steel, borderRadius: "4px 4px 0 0", opacity: 0.35 }} />
                )}
              </div>
              <span style={{ fontSize: 10, color: C.muted, marginTop: 4, fontWeight: 500 }}>{d[labelKey || "mois"]}</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function KPI({ num, label, sub, color }) {
  return (
    <div style={{ background: C.white, borderRadius: 12, padding: "16px 18px", border: `1px solid ${C.border}` }}>
      <div style={{ fontSize: 28, fontWeight: 800, color: color || C.noir, fontFamily: "'Poppins', sans-serif" }}>{num}</div>
      <div style={{ fontSize: 14, fontWeight: 600, marginTop: 2 }}>{label}</div>
      {sub && <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

function PredictiveAnalysis() {
  const [activeView, setActiveView] = useState("saison");

  return (
    <div style={{ fontFamily: "'Roboto',system-ui,sans-serif", background: C.fondClair, minHeight: "100vh", color: C.text }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #FDF0EE 0%, #F5E0DC 50%, #EEDDD9 100%)", padding: "24px 22px 18px" }}>
        <div style={{ maxWidth: 920, margin: "0 auto" }}>
          <p style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>Piste 4 · Modélisation prédictive</p>
          <h1 style={{ margin: 0, fontSize: 28, fontWeight: 700, fontFamily: "'Poppins', sans-serif", color: C.noir }}>
            Analyse prédictive saisonnière
          </h1>
          <p style={{ margin: "6px 0 0", fontSize: 14, color: C.muted }}>
            Anticiper la demande, la fatigue et les remplacements — basé sur les données SAP réelles
          </p>
        </div>
      </div>

      <div style={{ background: C.white, borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ maxWidth: 920, margin: "0 auto", display: "flex" }}>
          {views.map(v => (
            <button key={v.id} onClick={() => setActiveView(v.id)} style={{
              padding: "12px 14px", border: "none", background: "none", cursor: "pointer",
              fontSize: 14, fontWeight: activeView === v.id ? 700 : 500,
              color: activeView === v.id ? C.corail : C.muted,
              borderBottom: activeView === v.id ? `2px solid ${C.corail}` : "2px solid transparent",
              fontFamily: "'Poppins', sans-serif",
            }}>{v.icon} {v.label}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 920, margin: "0 auto", padding: "18px 22px 44px" }}>

        {activeView === "saison" && (
          <div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10, marginBottom: 16 }}>
              <KPI num={totalPrets2026.toLocaleString()} label="Prêts prévus 2026" sub={`+${growth}% vs 2025 (${totalPrets2025.toLocaleString()})`} color={C.corail} />
              <KPI num="690" label="Pic juillet prévu" sub="vs 646 en 2025 (+7%)" color={C.amber} />
              <KPI num="1 165" label="Prêts prévus juin-août" sub="40% de la demande annuelle en 8 semaines" color={C.violet} />
            </div>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
              <div style={{ background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}` }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4, fontFamily: "'Poppins', sans-serif" }}>
                  Prêts — 2025 réel vs 2026 prévu
                </div>
                <div style={{ display: "flex", gap: 12, marginBottom: 10, fontSize: 11 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, background: C.corail }} /> 2026 prévu</span>
                  <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, background: C.steel, opacity: 0.5 }} /> 2025 réel</span>
                </div>
                <VerticalBars data={seasonData} valKey="prets2026" compareKey="prets2025" color={C.corail} compareColor={C.steel} />
              </div>

              <div style={{ background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}` }}>
                <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 4, fontFamily: "'Poppins', sans-serif" }}>
                  Pannes — 2025 réel vs 2026 prévu
                </div>
                <div style={{ display: "flex", gap: 12, marginBottom: 10, fontSize: 11 }}>
                  <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, background: C.amber }} /> 2026 prévu</span>
                  <span style={{ display: "flex", alignItems: "center", gap: 4 }}><span style={{ width: 10, height: 10, borderRadius: 2, background: C.steel, opacity: 0.5 }} /> 2025 réel</span>
                </div>
                <VerticalBars data={seasonData} valKey="pannes2026" compareKey="pannes2025" color={C.amber} compareColor={C.steel} />
              </div>
            </div>

            {/* Key insight */}
            <div style={{ background: C.noir, borderRadius: 12, padding: 20, color: "#fff" }}>
              <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 8 }}>🔮 Prévision clé pour 2026-2027</div>
              <div style={{ fontSize: 15, lineHeight: 1.7 }}>
                Sur base des tendances 2025, nous prévoyons <strong>~3 073 prêts en 2026</strong> (+{growth}%). Le pic de juillet atteindra <strong>~690 prêts</strong>. La fenêtre critique (juin-août) concentrera 40% de la demande annuelle en 8 semaines. Les pannes liées au pic arriveront entre <strong>septembre et décembre 2026</strong> — c'est maintenant qu'il faut préparer la capacité de réparation.
              </div>
            </div>
          </div>
        )}

        {activeView === "capacite" && (
          <div>
            <p style={{ fontSize: 15, color: C.muted, marginBottom: 16 }}>
              Confrontation entre la demande prévue et la capacité estimée de traitement.
            </p>

            <div style={{ background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}`, marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, fontFamily: "'Poppins', sans-serif" }}>
                Taux de charge mensuel (demande / capacité)
              </div>
              {capacityAnalysis.map((m, i) => {
                const overloaded = m.taux > 100;
                const color = m.taux > 150 ? C.red : m.taux > 100 ? C.corail : m.taux > 80 ? C.amber : C.green;
                return (
                  <div key={i} style={{ marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, marginBottom: 3 }}>
                      <span style={{ fontWeight: 600, width: 50 }}>{m.mois}</span>
                      <span style={{ color: C.muted }}>{m.demande} demandes / {m.capacite} capacité</span>
                      <span style={{ fontWeight: 800, color: color, width: 60, textAlign: "right" }}>{m.taux}%</span>
                    </div>
                    <div style={{ height: 10, background: C.border, borderRadius: 5, overflow: "hidden", position: "relative" }}>
                      <div style={{ width: `${Math.min(m.taux, 250) / 2.5}%`, height: "100%", background: color, borderRadius: 5 }} />
                      {/* 100% marker */}
                      <div style={{ position: "absolute", left: "40%", top: 0, width: 2, height: "100%", background: C.noir + "40" }} />
                    </div>
                  </div>
                );
              })}
              <div style={{ display: "flex", gap: 16, marginTop: 12, fontSize: 11, color: C.muted }}>
                <span>La ligne noire = 100% de capacité</span>
                <span style={{ color: C.red }}>● > 150% = surcharge critique</span>
                <span style={{ color: C.corail }}>● > 100% = surcharge</span>
              </div>
            </div>

            <div style={{ background: C.corail + "10", borderRadius: 12, padding: 18, borderLeft: `4px solid ${C.corail}` }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.corail, marginBottom: 8, fontFamily: "'Poppins', sans-serif" }}>
                ⚠ 5 mois en surcharge en 2026
              </div>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>
                Mars, avril, mai, juillet et septembre dépassent la capacité nominale. Juillet atteint <strong>230%</strong> — chaque agent traite plus du double de sa charge normale. Solutions : renforts temporaires en saison, étalement des enlèvements, préparation anticipée du matériel.
              </div>
            </div>
          </div>
        )}

        {activeView === "fatigue" && (
          <div>
            <p style={{ fontSize: 15, color: C.muted, marginBottom: 16 }}>
              Répartition du parc de 2 277 tentes par niveau de fatigue, basée sur l'historique des réparations SAP.
            </p>

            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>

                <div key={i} style={{
                  background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}`,
                  borderLeft: `4px solid ${f.color}`,
                }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                    <div>
                      <div style={{ fontSize: 14, fontWeight: 700, color: f.color, fontFamily: "'Poppins', sans-serif" }}>
                        {f.categorie}
                      </div>
                      <div style={{ fontSize: 28, fontWeight: 800, color: C.noir, marginTop: 6, fontFamily: "'Poppins', sans-serif" }}>
                        {f.tentes}
                      </div>
                      <div style={{ fontSize: 12, color: C.muted }}>tentes · {f.pct}% du parc</div>
                    </div>
                    <div style={{
                      width: 50, height: 50, borderRadius: "50%", background: f.color + "15",
                      border: `3px solid ${f.color}`, display: "flex", alignItems: "center", justifyContent: "center",

                    }}>{f.pct}%</div>
                  </div>
                  <Bar value={f.pct} max={100} color={f.color} height={8} />
                  <div style={{
                    marginTop: 10, padding: "6px 10px", borderRadius: 6,
                    background: f.color + "10", fontSize: 12, fontWeight: 600, color: f.color,

              ))}
            </div>

            <div style={{ background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}`, marginBottom: 16 }}>
              <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, fontFamily: "'Poppins', sans-serif" }}>
                Vue du parc complet — 2 277 tentes
              </div>
              <div style={{ display: "flex", borderRadius: 8, overflow: "hidden", height: 40 }}>
                {fatiguePrediction.map((f, i) => (
                  <div key={i} style={{
                    width: `${f.pct}%`, background: f.color, display: "flex",
                    alignItems: "center", justifyContent: "center",
                    fontSize: 12, fontWeight: 700, color: "#fff",
                  }}>
                    {f.pct > 5 && `${f.pct}%`}
                  </div>
                ))}
              </div>
              <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 11, color: C.muted }}>
                <span>← Excellent état</span>
                <span>Critique →</span>
              </div>
            </div>

            <div style={{ background: C.violet + "10", borderRadius: 12, padding: 18, borderLeft: `4px solid ${C.violet}` }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.violet, marginBottom: 8, fontFamily: "'Poppins', sans-serif" }}>
                🔮 Prédiction : 65 tentes à remplacer d'ici fin 2027
              </div>
              <div style={{ fontSize: 14, lineHeight: 1.7 }}>
                Les 65 tentes en catégorie D (3% du parc) ont accumulé 5 réparations ou plus. Leur coût de maintenance dépasse progressivement la valeur résiduelle. Recommandation : planifier la fabrication de <strong>30 nouvelles tentes</strong> au premier semestre 2027 (25 Senior + 5 Junior) pour maintenir la capacité du parc.
              </div>
            </div>
          </div>
        )}

        {activeView === "remplacement" && (
          <div>
            <p style={{ fontSize: 15, color: C.muted, marginBottom: 16 }}>
              Plan de renouvellement du parc sur 4 ans, basé sur les projections de fatigue et la croissance de la demande.
            </p>

            <div style={{ background: C.white, borderRadius: 12, border: `1px solid ${C.border}`, overflow: "hidden", marginBottom: 16 }}>
              <div style={{ padding: "14px 18px", background: C.corail + "08", borderBottom: `1px solid ${C.border}` }}>
                <span style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>Plan de fabrication préventive</span>
              </div>
              {replacementPlan.map((r, i) => (
                <div key={i} style={{
                  padding: "16px 18px", borderBottom: i < replacementPlan.length - 1 ? `1px solid ${C.fondClair}` : "none",
                  display: "flex", gap: 16, alignItems: "flex-start",
                }}>
                  <div style={{
                    width: 52, height: 52, borderRadius: 10, background: C.corail + "12",
                    display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center",
                    flexShrink: 0,
                  }}>
                    <span style={{ fontSize: 18, fontWeight: 800, color: C.corail, fontFamily: "'Poppins', sans-serif" }}>{r.total}</span>
                    <span style={{ fontSize: 9, color: C.muted }}>tentes</span>
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>{r.annee}</div>
                    <div style={{ fontSize: 13, color: C.muted, marginTop: 2 }}>
                      {r.senior} Senior + {r.junior} Junior
                    </div>
                    <div style={{ fontSize: 13, marginTop: 4, lineHeight: 1.5 }}>{r.motif}</div>
                  </div>
                </div>
              ))}
              <div style={{ padding: "14px 18px", background: C.noir + "05", borderTop: `1px solid ${C.border}`, display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <span style={{ fontSize: 14, fontWeight: 700 }}>Total 2027-2030</span>
                <span style={{ fontSize: 22, fontWeight: 800, color: C.corail, fontFamily: "'Poppins', sans-serif" }}>
                  {replacementPlan.reduce((s, r) => s + r.total, 0)} tentes
                </span>
              </div>
            </div>

            {/* Impact simulation */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 16 }}>
              <div style={{ background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}` }}>
                <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 10, fontFamily: "'Poppins', sans-serif" }}>
                  Sans renouvellement
                </div>
                {[
                  { label: "Taux de disponibilité 2028", value: "74%", color: C.red },
                  { label: "Tentes en catégorie D", value: "~180", color: C.red },
                  { label: "Coût maintenance / tente", value: "+35%", color: C.red },
                  { label: "Risque refus emprunteurs", value: "Élevé", color: C.red },
                ].map((r, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.fondClair}`, fontSize: 13 }}>
                    <span>{r.label}</span>
                    <span style={{ fontWeight: 700, color: r.color }}>{r.value}</span>
                  </div>
                ))}
              </div>

              <div style={{ background: C.white, borderRadius: 12, padding: 18, border: `1px solid ${C.border}` }}>
                <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 10, fontFamily: "'Poppins', sans-serif", color: C.green }}>
                  Avec renouvellement planifié ✓
                </div>
                {[
                  { label: "Taux de disponibilité 2028", value: "≥ 85%", color: C.green },
                  { label: "Tentes en catégorie D", value: "< 30", color: C.green },
                  { label: "Coût maintenance / tente", value: "−15%", color: C.green },
                  { label: "Risque refus emprunteurs", value: "Faible", color: C.green },
                ].map((r, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", padding: "6px 0", borderBottom: `1px solid ${C.fondClair}`, fontSize: 13 }}>
                    <span>{r.label}</span>
                    <span style={{ fontWeight: 700, color: r.color }}>{r.value}</span>
                  </div>
                ))}
              </div>
