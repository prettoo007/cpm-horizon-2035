function Bar({ value, max, color, height }) {
  return (
    <div style={{ height: height || 8, background: C.border, borderRadius: 4, overflow: "hidden" }}>
      <div style={{ width: `${Math.min((value / max) * 100, 100)}%`, height: "100%", background: color, borderRadius: 4 }} />
    </div>
  );
}

function VBars({ data, valKey, color, labelKey, maxVal }) {
  const mx = maxVal || Math.max(...data.map(d => d[valKey]));
  return (
    <div style={{ display: "flex", gap: 4, height: 220 }}>
      {data.map((d, i) => {
        const v = d[valKey];
        const h = Math.max((v / mx) * 190, 3);
        const isMax = v === mx;
        return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end" }}>
            <span style={{ fontSize: 9, fontWeight: 700, color: isMax ? color : C.text, marginBottom: 4 }}>{v > 0 ? v : ""}</span>
            <div style={{ width: "75%", height: h, background: isMax ? color : color + "80", borderRadius: "4px 4px 0 0" }} />
            <span style={{ fontSize: 10, color: C.muted, marginTop: 4, fontWeight: isMax ? 700 : 500 }}>{d[labelKey || "mois"]}</span>
          </div>
        );
      })}
    </div>
  );
}

function KPI({ num, label, sub, color }) {
  return (
    <div style={{ background: C.white, borderRadius: 12, padding: "16px 18px", border: `1px solid ${C.border}` }}>
      <div style={{ fontSize: 26, fontWeight: 800, color: color || C.noir, fontFamily: "'Poppins', sans-serif" }}>{num}</div>
      <div style={{ fontSize: 14, fontWeight: 600, marginTop: 2 }}>{label}</div>
      {sub && <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>{sub}</div>}
    </div>
  );
}

                color: C.steel, icon: "🤝",
              },
            ].map((ins, i) => (
              <div key={i} style={{
                background: C.white, borderRadius: 12, border: `1px solid ${C.border}`,
                borderLeft: `4px solid ${ins.color}`, padding: 18, marginBottom: 10,
              }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: 20 }}>{ins.icon}</span>
                  <span style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>{ins.title}</span>
                </div>
                <div style={{ fontSize: 14, lineHeight: 1.7, marginBottom: 10 }}>{ins.insight}</div>
                <div style={{ padding: "8px 14px", borderRadius: 8, background: ins.color + "10", fontSize: 13, fontWeight: 600, color: ins.color }}>
                  → {ins.action}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <div style={{ padding: "14px 22px", borderTop: `1px solid ${C.border}`, background: C.white, textAlign: "center" }}>
        <span style={{ fontSize: 12, color: C.muted }}>Données SAP · Tentes_1.xlsx · Analyse CPM Horizon 2035 · Août 2026</span>
      </div>
    </div>
  );
}
