function HealthBadge({ score, size }) {
  const s = size || 36;
  const grade = score >= 85 ? "A" : score >= 65 ? "B" : score >= 40 ? "C" : "D";
  const color = score >= 85 ? C.green : score >= 65 ? C.amber : score >= 40 ? C.corail : C.red;
  return (
    <div style={{
      width: s, height: s, borderRadius: "50%", background: color + "18", border: `2px solid ${color}`,
      display: "flex", alignItems: "center", justifyContent: "center",
      fontSize: s * 0.45, fontWeight: 800, color: color, fontFamily: "'Poppins', sans-serif",
    }}>{grade}</div>
  );
}

function StatusBadge({ status }) {
  const colors = { "En réparation": C.corail, "Disponible": C.green, "En lavage": C.amber, "Prêtée": C.blue };
  const col = colors[status] || C.muted;
  return (
    <span style={{
      padding: "3px 12px", borderRadius: 12, fontSize: 12, fontWeight: 600,
      background: col + "18", color: col, fontFamily: "'Roboto', sans-serif",
    }}>{status}</span>
  );
}

            { label: "STATUT", value: tent.status, color: tent.status === "Disponible" ? C.green : C.corail },
            { label: "LOCALISATION", value: tent.location, color: C.steel },
            { label: "ESPÉRANCE DE VIE", value: tent.lifeExpectancy, color: tent.healthScore >= 65 ? C.green : C.amber },
          ].map((card, i) => (
            <div key={i} style={{ background: card.color + "10", borderRadius: 10, padding: "10px 14px" }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: card.color, textTransform: "uppercase", letterSpacing: 1 }}>{card.label}</div>
              <div style={{ fontSize: 15, fontWeight: 700, color: C.noir, marginTop: 4, fontFamily: "'Poppins', sans-serif" }}>{card.value}</div>

          ))}
        </div>
      </div>

      {/* Lifecycle visualization */}
      <div style={{ background: C.white, borderRadius: 12, border: `1px solid ${C.border}`, padding: 20, marginBottom: 12 }}>
        <div style={{ fontSize: 16, fontWeight: 700, marginBottom: 14, fontFamily: "'Poppins', sans-serif" }}>
          Cycle de vie — Position actuelle
        </div>
        <div style={{ display: "flex", gap: 2, alignItems: "center" }}>
          {cycleSteps.map((s, i) => {
            const isActive = i === step;
            const isPast = i < step;
            return (
              <div key={i} style={{ flex: 1, textAlign: "center" }}>
                <div style={{
                  width: 36, height: 36, borderRadius: "50%", margin: "0 auto 6px",
                  background: isActive ? s.color : isPast ? s.color + "30" : C.border + "60",

                  fontSize: 16, border: isActive ? `3px solid ${s.color}` : "none",
                  boxShadow: isActive ? `0 0 12px ${s.color}40` : "none",

                  {s.icon}

                <div style={{
                  fontSize: 9, fontWeight: isActive ? 700 : 400,
                  color: isActive ? s.color : C.muted,
                  fontFamily: "'Roboto', sans-serif",
                }}>{s.name}</div>
                {i < cycleSteps.length - 1 && (

                    position: "relative", top: -28, left: "55%", width: "90%", height: 2,

      </div>

      {/* Repairs + Predictions */}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div style={{ background: C.white, borderRadius: 12, border: `1px solid ${C.border}`, padding: 18 }}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12, fontFamily: "'Poppins', sans-serif" }}>
            Historique des interventions
          </div>
          {tent.repairs === 0 ? (
            <div style={{ fontSize: 14, color: C.green, fontWeight: 600 }}>Aucune intervention enregistrée</div>
          ) : (
            [
              { type: "LAVAGE TENTE", date: "25/03/2024", avis: "300012621", agent: "LIEGJ001" },
              { type: "CORDAGE D'ANGLE", date: "24/11/2014", avis: "300003335", agent: "REDIV001" },
              { type: "LAVAGE TENTE", date: "24/11/2014", avis: "300003335", agent: "REDIV001" },
            ].slice(0, tent.repairs).map((r, i) => (
              <div key={i} style={{ padding: "8px 0", borderBottom: `1px solid ${C.fondClair}` }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontSize: 14, fontWeight: 700 }}>{r.type}</span>
                  <span style={{ fontSize: 11, color: C.muted }}>avis {r.avis}</span>
                </div>
                <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                  {r.date} · {r.agent}
                </div>
              </div>
            ))
          )}
        </div>

        <div style={{ background: C.white, borderRadius: 12, border: `1px solid ${C.border}`, padding: 18 }}>
          <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 12, fontFamily: "'Poppins', sans-serif", color: C.violet }}>
            🔮 Maintenance prédictive
          </div>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>Indice de santé</div>
            <div style={{ height: 8, background: C.border, borderRadius: 4, overflow: "hidden" }}>
              <div style={{
                width: `${tent.healthScore}%`, height: "100%", borderRadius: 4,
                background: tent.healthScore >= 65 ? C.green : tent.healthScore >= 40 ? C.amber : C.red,
              }} />
            </div>
            <div style={{ fontSize: 22, fontWeight: 800, color: tent.healthScore >= 65 ? C.green : C.amber, marginTop: 6, fontFamily: "'Poppins', sans-serif" }}>
              {tent.healthScore}/100
            </div>
          </div>
          <div style={{ fontSize: 13, marginBottom: 4 }}><strong>Espérance de vie :</strong> {tent.lifeExpectancy}</div>
          <div style={{ fontSize: 13, marginBottom: 4 }}><strong>Panne la plus probable :</strong> {tent.topPanne}</div>
          <div style={{ fontSize: 13 }}><strong>Recommandation :</strong> {tent.healthScore >= 65 ? "Maintien en service" : tent.healthScore >= 40 ? "Surveillance renforcée" : "Déclassement à envisager"}</div>
        </div>
      </div>
    </div>
  );
}

function InspectionView() {
  const [phase, setPhase] = useState("upload");
  const [analyzing, setAnalyzing] = useState(false);

  const startAnalysis = () => {
    setAnalyzing(true);
    setPhase("analyzing");
    setTimeout(() => {
      setPhase("result");
      setAnalyzing(false);
    }, 3000);
  };

  return (
    <div>
      <div style={{ background: C.white, borderRadius: 12, border: `1px solid ${C.border}`, padding: 20, marginBottom: 12 }}>
        <div style={{ fontSize: 18, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 4 }}>
          Module d'inspection IA
        </div>
        <div style={{ fontSize: 14, color: C.muted, marginBottom: 16 }}>
          Claude Vision analyse les photos de retour et génère un diagnostic structuré.
        </div>

        {phase === "upload" && (
          <div>
            <div onClick={startAnalysis} style={{
              border: `2px dashed ${C.corail}`, borderRadius: 12, padding: "40px 20px",
              textAlign: "center", cursor: "pointer", background: C.fondRose,
              transition: "all 0.2s",
            }}>
              <div style={{ fontSize: 40, marginBottom: 8 }}>📸</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: C.corail, fontFamily: "'Poppins', sans-serif" }}>
                Cliquez pour simuler l'upload d'une photo
              </div>
              <div style={{ fontSize: 13, color: C.muted, marginTop: 6 }}>
                En production : prise de photo via tablette ou upload depuis Zebra MC330L
              </div>
            </div>
          </div>
        )}

        {phase === "analyzing" && (
          <div style={{ textAlign: "center", padding: "40px 20px" }}>
            <div style={{ fontSize: 40, marginBottom: 12, animation: "spin 2s linear infinite" }}>🔍</div>
            <style>{`@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }`}</style>
            <div style={{ fontSize: 16, fontWeight: 700, color: C.violet, fontFamily: "'Poppins', sans-serif" }}>
              Claude Vision analyse la photo...
            </div>
            <div style={{ fontSize: 13, color: C.muted, marginTop: 6 }}>
              Détection d'usure · État des coutures · Propreté · Cotation automatique
            </div>
          </div>
        )}

        {phase === "result" && (
          <div>
            {/* Result header */}
            <div style={{
              background: C.amber + "12", borderRadius: 10, padding: 16, marginBottom: 14,
              border: `1px solid ${C.amber}30`,
            }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                <div>
                  <div style={{ fontSize: 12, color: C.amber, fontWeight: 700, textTransform: "uppercase" }}>
                    Diagnostic IA — Tente #2240301537
                  </div>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.noir, fontFamily: "'Poppins', sans-serif", marginTop: 4 }}>
                    Cotation : C — Réparation nécessaire
                  </div>
                </div>
                <HealthBadge score={42} size={50} />
              </div>
            </div>

            {/* Detailed findings */}
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 10, fontFamily: "'Poppins', sans-serif" }}>
              Constats détectés par l'IA
            </div>
            {[
              { zone: "Toile principale", constat: "Usure visible sur la face sud — amincissement du tissu estimé à 40%", severity: "Élevé", color: C.corail },
              { zone: "Couture latérale gauche", constat: "Début de décousure sur 12 cm — risque d'infiltration en cas de pluie", severity: "Élevé", color: C.corail },
              { zone: "Cordage d'angle", constat: "Tension inégale — point d'ancrage arrière-droit fragilisé", severity: "Moyen", color: C.amber },
              { zone: "Propreté générale", constat: "Traces de terre et d'humidité — lavage recommandé avant réparation", severity: "Faible", color: C.steel },
            ].map((f, i) => (
              <div key={i} style={{
                background: C.white, borderRadius: 10, padding: "12px 16px", marginBottom: 6,
                border: `1px solid ${C.border}`, borderLeft: `3px solid ${f.color}`,
              }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 4 }}>
                  <span style={{ fontSize: 14, fontWeight: 700 }}>{f.zone}</span>
                  <span style={{
                    padding: "2px 8px", borderRadius: 10, fontSize: 10, fontWeight: 700,
                    background: f.color + "18", color: f.color,
                  }}>{f.severity}</span>
                </div>
                <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.5 }}>{f.constat}</div>
              </div>
            ))}

            {/* Recommendation */}
            <div style={{
              marginTop: 14, background: C.violet + "10", borderRadius: 10, padding: 16,
              borderLeft: `3px solid ${C.violet}`,
            }}>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.violet, marginBottom: 6, fontFamily: "'Poppins', sans-serif" }}>
                Recommandation IA
              </div>
              <div style={{ fontSize: 14, lineHeight: 1.6 }}>
                Lavage complet puis réparation de la couture latérale gauche en priorité. Surveillance renforcée de la toile principale — si l'usure progresse, envisager le déclassement à la prochaine saison. Cordage à retensionner lors de la réparation.
              </div>
              <div style={{
                marginTop: 10, padding: "8px 12px", borderRadius: 8,
                background: C.amber + "15", fontSize: 12, color: C.amber, fontWeight: 600,
              }}>
                ⚠ Ce diagnostic est un avis IA — la décision finale appartient au contremaître.
              </div>
            </div>

            <button onClick={() => setPhase("upload")} style={{
              marginTop: 14, padding: "10px 20px", borderRadius: 8, border: "none",
              background: C.corail, color: C.white, fontSize: 14, fontWeight: 600,
              cursor: "pointer", fontFamily: "'Poppins', sans-serif",
            }}>Nouvelle inspection</button>
          </div>
        )}
      </div>
    </div>
  );
}

function TentPrototype() {
  const [view, setView] = useState("dashboard");
  const [selectedTent, setSelectedTent] = useState(null);

  const views = [
    { id: "dashboard", label: "Tableau de bord", icon: "📊" },
    { id: "inspection", label: "Inspection IA", icon: "👁️" },
  ];

  return (
    <div style={{ fontFamily: "'Roboto','Segoe UI',system-ui,sans-serif", background: C.fondClair, minHeight: "100vh", color: C.text }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #FDF0EE 0%, #F5E0DC 50%, #EEDDD9 100%)", padding: "22px 22px 18px", color: C.noir }}>
        <div style={{ maxWidth: 920, margin: "0 auto" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <img src={PASTILLE} alt="C" style={{ width: 32, height: 32 }} />
              <div>
                <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>
                  CPM · Cycle de vie des tentes
                </div>
                <div style={{ fontSize: 12, color: C.muted }}>
                  Plateforme de traçabilité — Fédération Wallonie-Bruxelles
                </div>
              </div>
            </div>
            <div style={{
              padding: "6px 14px", borderRadius: 20, background: C.corail + "15",
              fontSize: 12, fontWeight: 600, color: C.corail,
            }}>
              Prototype v2 · Sprint 2
            </div>
          </div>
        </div>
      </div>

      {/* Navigation */}
      <div style={{ background: C.white, borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ maxWidth: 920, margin: "0 auto", display: "flex" }}>
          {views.map(v => (
            <button key={v.id} onClick={() => { setView(v.id); setSelectedTent(null); }} style={{
              padding: "12px 20px", border: "none", background: "none", cursor: "pointer",
              fontSize: 15, fontWeight: view === v.id ? 700 : 500,
              color: view === v.id ? C.corail : C.muted,
              borderBottom: view === v.id ? `2px solid ${C.corail}` : "2px solid transparent",
              fontFamily: "'Poppins', sans-serif",
            }}>{v.icon} {v.label}</button>
          ))}
        </div>
      </div>

      {/* Content */}
      <div style={{ maxWidth: 920, margin: "0 auto", padding: "18px 22px 44px" }}>
        {view === "dashboard" && !selectedTent && (
          <DashboardView onSelectTent={(t) => setSelectedTent(t)} />
        )}
        {view === "dashboard" && selectedTent && (
          <TentDetailView tent={selectedTent} onBack={() => setSelectedTent(null)} />
        )}
        {view === "inspection" && <InspectionView />}
      </div>

      {/* Footer */}
      <div style={{ padding: "14px 22px", borderTop: `1px solid ${C.border}`, background: C.white, textAlign: "center" }}>
        <span style={{ fontSize: 12, color: C.muted }}>
          Centre de Prêt de Matériel · Administration générale de la Culture · Fédération Wallonie-Bruxelles
        </span>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(TentPrototype));
    </script>
