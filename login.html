<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPM Horizon 2035 — Connexion</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'><circle cx='20' cy='20' r='20' fill='%23e74c3c'/><text x='20' y='28' font-size='28' font-weight='bold' fill='white' text-anchor='middle'>C</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 60px 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            font-size: 48px;
            font-weight: 700;
            margin: 0 auto 30px;
        }

        h1 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 8px rgba(231, 76, 60, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            color: white;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(231, 76, 60, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .error {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .info {
            background: #ecf0f1;
            border-left: 4px solid #e74c3c;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            color: #555;
            margin-top: 20px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">C</div>
        <h1>CPM Horizon 2035</h1>
        <p class="subtitle">Schéma Directeur — Transformation Numérique du Patrimoine</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="password">🔐 Mot de passe</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Entrez le mot de passe"
                    autofocus
                    required
                >
            </div>
            <button type="submit" class="login-btn">Accéder</button>
            <div class="error" id="error">❌ Mot de passe incorrect</div>
        </form>

        <div class="info">
            💡 <strong>Mot de passe:</strong> CPM2035
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error');

            if (password === 'CPM2035') {
                // Stocker session (pas localStorage - plus sécurisé)
                sessionStorage.setItem('cpm_authenticated', 'true');
                window.location.href = 'index.html';
            } else {
                errorMsg.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }

        // Si déjà authentifié, rediriger
        if (sessionStorage.getItem('cpm_authenticated')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
