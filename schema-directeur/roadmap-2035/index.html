function StatusDot({ status }) {
  const s = STATUS[status];
  return <span style={{ display: "inline-block", width: 8, height: 8, borderRadius: "50%", background: s.color, flexShrink: 0, marginTop: 5 }} />;
}

function PhaseCard({ phase, isExpanded, onToggle }) {
  const s = STATUS[phase.status];
  return (
    <div style={{
      background: C.white, borderRadius: 12,
      border: isExpanded ? `2px solid ${C.corail}` : `1px solid ${C.border}`,
      marginBottom: 8, overflow: "hidden",
    }}>
      <div onClick={onToggle} style={{ padding: "14px 18px", cursor: "pointer", display: "flex", alignItems: "center", gap: 14 }}>
        <div style={{
          width: 38, height: 38, borderRadius: "50%",
          background: s.bg, border: `2px solid ${s.color}`,
          display: "flex", alignItems: "center", justifyContent: "center",
          fontSize: 12, fontWeight: 800, color: s.color, flexShrink: 0,
          fontFamily: "'Poppins', 'Segoe UI', sans-serif",
        }}>
          {phase.status === "done" ? "✓" : phase.status === "active" ? "▶" : "○"}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <span style={{ fontWeight: 700, fontSize: 17, color: C.noir, fontFamily: "'Poppins', 'Segoe UI', sans-serif" }}>{phase.name}</span>
            <span style={{
              padding: "2px 10px", borderRadius: 12, fontSize: 10, fontWeight: 600,
              background: s.bg, color: s.color, fontFamily: "'Roboto', 'Segoe UI', sans-serif",
            }}>{s.label}</span>
          </div>
          <div style={{ fontSize: 14, color: C.muted, marginTop: 2, fontFamily: "'Roboto', 'Segoe UI', sans-serif" }}>
            {phase.subtitle}{phase.period ? ` · ${phase.period}` : ""}
          </div>
        </div>
        <span style={{ fontSize: 20, color: C.muted, transition: "transform 0.2s", transform: isExpanded ? "rotate(180deg)" : "none" }}>⌄</span>
      </div>

      {isExpanded && (
        <div style={{ padding: "0 18px 16px", borderTop: `1px solid ${C.border}` }}>
          <div style={{ marginTop: 12 }}>
            {phase.milestones.map((m, i) => {
              const ms = STATUS[m.status];
              return (
                <div key={i} style={{ display: "flex", gap: 10, padding: "7px 0", borderBottom: i < phase.milestones.length - 1 ? `1px solid ${C.fondClair}` : "none" }}>
                  <StatusDot status={m.status} />
                  <span style={{
                    fontSize: 15, lineHeight: 1.6, fontFamily: "'Roboto', 'Segoe UI', sans-serif",
                    color: m.status === "done" ? C.green : m.status === "active" ? C.noir : C.muted,
                    fontWeight: m.status === "active" ? 600 : 400,
                  }}>{m.text}</span>
                </div>
              );
            })}
          </div>
          {phase.decision && (
            <div style={{
              marginTop: 12, padding: "10px 14px", borderRadius: 10,
              background: C.corailLight, borderLeft: `3px solid ${C.corail}`,
              fontSize: 14, fontWeight: 700, color: C.corail,
              fontFamily: "'Poppins', 'Segoe UI', sans-serif",
            }}>
              🚦 {phase.decision}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
