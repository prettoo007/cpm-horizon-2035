function LayerCard({ layer, isOpen, onToggle }) {
  return (
    <div style={{
      background: C.white, borderRadius: 12, marginBottom: 8,
      border: isOpen ? `2px solid ${layer.color}` : `1px solid ${C.border}`,
      overflow: "hidden",
    }}>
      <div onClick={onToggle} style={{
        padding: "14px 20px", cursor: "pointer",
        display: "flex", alignItems: "center", gap: 14,
        background: isOpen ? layer.color + "08" : "transparent",
      }}>
        <div style={{
          width: 8, height: 42, borderRadius: 4, background: layer.color, flexShrink: 0,
        }} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: C.noir, fontFamily: "'Poppins', sans-serif", letterSpacing: "0.5px" }}>
            {layer.name}
          </div>
          <div style={{ fontSize: 14, color: C.muted, marginTop: 2, fontFamily: "'Roboto', sans-serif" }}>
            {layer.desc}
          </div>
        </div>
        <div style={{ fontSize: 14, fontWeight: 700, color: layer.color, fontFamily: "'Poppins', sans-serif" }}>
          {layer.components.length}
        </div>
        <span style={{ fontSize: 18, color: C.muted, transform: isOpen ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>⌄</span>
      </div>
      {isOpen && (
        <div style={{ padding: "0 20px 16px" }}>
          {layer.components.map((comp, i) => (
            <div key={i} style={{
              display: "flex", gap: 12, padding: "12px 0",
              borderTop: `1px solid ${C.fondClair}`,
            }}>
              <div style={{
                width: 44, height: 44, borderRadius: 10, background: layer.color + "12",
                display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: 13, fontWeight: 800, color: layer.color, flexShrink: 0,
                fontFamily: "'Poppins', sans-serif",
              }}>
                {comp.name.substring(0, 2).toUpperCase()}
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                  <span style={{ fontSize: 15, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>{comp.name}</span>
                  <span style={{
                    padding: "2px 8px", borderRadius: 10, fontSize: 11, fontWeight: 600,
                    background: layer.color + "15", color: layer.color,
                    fontFamily: "'Roboto', sans-serif",
                  }}>{comp.type}</span>
                </div>
                <div style={{ fontSize: 14, color: C.muted, lineHeight: 1.6, fontFamily: "'Roboto', sans-serif" }}>
                  {comp.detail}
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function CycleView() {
  const [activeStep, setActiveStep] = useState(0);
  const step = cycleSteps[activeStep];

  return (
    <div>
      {/* Visual cycle */}
      <div style={{
        display: "flex", flexWrap: "wrap", gap: 4, marginBottom: 20, justifyContent: "center",
      }}>
        {cycleSteps.map((s, i) => (
          <button key={i} onClick={() => setActiveStep(i)} style={{
            padding: "10px 14px", borderRadius: 10, border: "none", cursor: "pointer",
            background: activeStep === i ? s.color : C.white,
            color: activeStep === i ? "#fff" : C.text,
            fontSize: 13, fontWeight: 600, fontFamily: "'Roboto', sans-serif",
            boxShadow: activeStep === i ? `0 2px 8px ${s.color}40` : `0 1px 3px ${C.border}`,
            transition: "all 0.2s",
            display: "flex", alignItems: "center", gap: 6,
          }}>
            <span style={{ fontSize: 16 }}>{s.icon}</span>
            {s.step}
            {i < cycleSteps.length - 1 && (
              <span style={{ color: activeStep === i ? "#fff" : C.muted, marginLeft: 2 }}>→</span>
            )}
          </button>
        ))}
      </div>

      {/* Step detail */}
      <div style={{
        background: C.white, borderRadius: 12, border: `2px solid ${step.color}`,
        overflow: "hidden",
      }}>
        <div style={{
          padding: "18px 22px", background: step.color + "0A",
          borderBottom: `1px solid ${C.border}`,
          display: "flex", alignItems: "center", gap: 14,
        }}>
          <span style={{ fontSize: 32 }}>{step.icon}</span>
          <div>
            <div style={{ fontSize: 20, fontWeight: 700, color: C.noir, fontFamily: "'Poppins', sans-serif" }}>
              {step.step}
            </div>
            <div style={{ fontSize: 14, color: C.muted, fontFamily: "'Roboto', sans-serif" }}>
              Étape {activeStep + 1} / {cycleSteps.length} du cycle de vie
            </div>
          </div>
        </div>
        <div style={{ padding: "18px 22px" }}>
          {[
            { label: "Données produites", value: step.data, icon: "📊" },
            { label: "Source de saisie", value: step.source, icon: "👤" },
            { label: "Outil utilisé", value: step.tool, icon: "⚙️" },
            { label: "Enrichissement", value: step.enrichment, icon: "✨" },
          ].map((field, i) => (
            <div key={i} style={{
              display: "flex", gap: 12, padding: "12px 0",
              borderBottom: i < 3 ? `1px solid ${C.fondClair}` : "none",
              alignItems: "flex-start",
            }}>
              <span style={{ fontSize: 18, flexShrink: 0, marginTop: 1 }}>{field.icon}</span>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700, color: step.color, fontFamily: "'Poppins', sans-serif", marginBottom: 3 }}>
                  {field.label}
                </div>
                <div style={{ fontSize: 15, lineHeight: 1.6, fontFamily: "'Roboto', sans-serif" }}>
                  {field.value}
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Principle reminder */}
      <div style={{
        marginTop: 14, padding: "14px 18px", borderRadius: 10,
        background: C.corail + "10", borderLeft: `3px solid ${C.corail}`,
        fontSize: 14, fontStyle: "italic", color: C.text, lineHeight: 1.6,
        fontFamily: "'Roboto', sans-serif",
      }}>
        Une donnée accompagne chaque équipement durant toute sa vie. Chaque métier l'enrichit. Aucun métier ne la recrée.
      </div>
    </div>
  );
}

function IntegrationsView() {
  const [openInt, setOpenInt] = useState(0);

  return (
    <div>
      <p style={{ fontSize: 15, color: C.muted, marginBottom: 16, fontFamily: "'Roboto', sans-serif" }}>
        6 flux d'intégration reliant les composants du système. Cliquez pour voir le détail.
      </p>
      {integrations.map((integ, i) => (
        <div key={i} style={{
          background: C.white, borderRadius: 12, marginBottom: 8,
          border: openInt === i ? `2px solid ${integ.color}` : `1px solid ${C.border}`,
          overflow: "hidden",
        }}>
          <div onClick={() => setOpenInt(openInt === i ? null : i)} style={{
            padding: "14px 20px", cursor: "pointer",
            display: "flex", alignItems: "center", gap: 14,
          }}>
            <div style={{
              width: 10, height: 10, borderRadius: "50%", background: integ.color, flexShrink: 0,
            }} />
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>
                {integ.name}
              </div>
              <div style={{ fontSize: 13, color: C.muted, fontFamily: "'Roboto', sans-serif" }}>
                {integ.type} · {integ.direction}
              </div>
            </div>
            <span style={{
              padding: "3px 10px", borderRadius: 10, fontSize: 11, fontWeight: 700,
              background: integ.color + "15", color: integ.color,
              fontFamily: "'Roboto', sans-serif",
            }}>{integ.status}</span>
          </div>
          {openInt === i && (
            <div style={{
              padding: "0 20px 16px", borderTop: `1px solid ${C.fondClair}`,
            }}>
              <p style={{ fontSize: 15, lineHeight: 1.7, color: C.text, marginTop: 12, fontFamily: "'Roboto', sans-serif" }}>
                {integ.detail}
              </p>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function ArchitectureDiagram() {
  const [activeView, setActiveView] = useState("layers");
  const [openLayer, setOpenLayer] = useState(2);

  return (
    <div style={{ fontFamily: "'Roboto', 'Segoe UI', system-ui, sans-serif", background: C.fondClair, minHeight: "100vh", color: C.text }}>
      {/* Header */}
      <div style={{ background: "linear-gradient(135deg, #FDF0EE 0%, #F5E0DC 50%, #EEDDD9 100%)", padding: "28px 22px", color: C.noir }}>
        <div style={{ maxWidth: 880, margin: "0 auto" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14 }}>
            <img src={PASTILLE} alt="Culture" style={{ width: 24, height: 24 }} />
            <span style={{ fontSize: 12, color: C.muted, fontFamily: "'Roboto', sans-serif" }}>
              Livrable 3 — Schéma directeur CPM Horizon 2035
            </span>
          </div>
          <h1 style={{ margin: 0, fontSize: 28, fontWeight: 700, fontFamily: "'Poppins', sans-serif" }}>
            Architecture technique
          </h1>
          <p style={{ margin: "6px 0 0", fontSize: 15, color: C.muted, fontFamily: "'Roboto', sans-serif" }}>
            Du terrain jusqu'à la décision — chaque couche enrichit le patrimoine numérique commun
          </p>
        </div>
      </div>

      {/* View selector */}
      <div style={{ background: C.white, borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, zIndex: 10 }}>
        <div style={{ maxWidth: 880, margin: "0 auto", display: "flex" }}>
          {views.map(v => (
            <button key={v.id} onClick={() => setActiveView(v.id)} style={{
              padding: "13px 20px", border: "none", background: "none", cursor: "pointer",
              fontSize: 15, fontWeight: activeView === v.id ? 700 : 500,
              color: activeView === v.id ? C.corail : C.muted,
              borderBottom: activeView === v.id ? `2px solid ${C.corail}` : "2px solid transparent",
              fontFamily: "'Poppins', sans-serif",
            }}>{v.icon} {v.label}</button>
          ))}
        </div>
      </div>

      <div style={{ maxWidth: 880, margin: "0 auto", padding: "20px 22px 44px" }}>

        {activeView === "layers" && (
          <div>
            <p style={{ fontSize: 15, color: C.muted, marginBottom: 16, fontFamily: "'Roboto', sans-serif" }}>
              5 couches, du terrain jusqu'au pilotage. Chaque couche s'appuie sur la précédente et enrichit le patrimoine numérique.
            </p>

            {/* Direction arrow */}
            <div style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "8px 16px", marginBottom: 12, fontSize: 12, color: C.muted,
              fontFamily: "'Roboto', sans-serif",
            }}>
              <span>⬆ Décision</span>
              <span style={{ fontSize: 11, fontStyle: "italic" }}>Les données montent, la valeur se crée</span>
              <span>Terrain ⬇</span>
            </div>

            {layers.map((layer, i) => (
              <LayerCard
                key={i} layer={layer}
                isOpen={openLayer === i}
                onToggle={() => setOpenLayer(openLayer === i ? null : i)}
              />
            ))}
          </div>
        )}

        {activeView === "cycle" && <CycleView />}
        {activeView === "integrations" && <IntegrationsView />}
      </div>

      {/* Footer */}
      <div style={{ padding: "14px 22px", borderTop: `1px solid ${C.border}`, background: C.white, textAlign: "center" }}>
        <span style={{ fontSize: 12, color: C.muted, fontFamily: "'Roboto', sans-serif" }}>
          Centre de Prêt de Matériel · Administration générale de la Culture · Fédération Wallonie-Bruxelles
        </span>
      </div>
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ArchitectureDiagram));
    </script>
</body>
</html>
