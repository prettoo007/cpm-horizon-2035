  { step: "Assembler les mâts", detail: "Insérer les mâts centraux dans les fourreaux. Vérifier que les embouts sont bien enfoncés.", time: "3 min" },

const pliageSteps = [
  { step: "Retirer les sardines", detail: "Les rassembler dans le sac prévu — ne pas les laisser dans l'herbe !", time: "3 min" },

  { step: "Baisser la structure", detail: "Retirer les mâts centraux délicatement. Ne jamais tirer sur la toile.", time: "3 min" },
  { step: "Plier la toile", detail: "Plier en accordéon dans le sens de la longueur, puis rouler serré. NE PAS arracher la toile contre les entretoises.", time: "5 min" },
  { step: "Ranger les accessoires", detail: "Mâts, sardines, tendeurs — chaque élément dans son sac. Vérifier qu'il ne manque rien.", time: "3 min" },
  { step: "Sangler le tout", detail: "Entourer le rouleau avec les sangles fournies. La tente doit tenir compacte.", time: "2 min" },
];

function Section({ title, icon, children, defaultOpen }) {
  const [open, setOpen] = useState(defaultOpen || false);
  return (
    <div style={{
      background: C.white, borderRadius: 14, border: `1px solid ${C.border}`,
      marginBottom: 10, overflow: "hidden",
    }}>
      <div onClick={() => setOpen(!open)} style={{
        padding: "16px 20px", cursor: "pointer",
        display: "flex", alignItems: "center", justifyContent: "space-between",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 22 }}>{icon}</span>
          <span style={{ fontSize: 17, fontWeight: 700, fontFamily: "'Poppins', sans-serif", color: C.noir }}>{title}</span>
        </div>
        <span style={{ fontSize: 20, color: C.muted, transform: open ? "rotate(180deg)" : "none", transition: "transform 0.2s" }}>⌄</span>
      </div>
      {open && <div style={{ padding: "0 20px 18px", borderTop: `1px solid ${C.fondClair}` }}>{children}</div>}
    </div>
  );
}

              {montageSteps.map((s, i) => (
                <div key={i} style={{
                  display: "flex", gap: 12, padding: "10px 0",
                  borderBottom: i < montageSteps.length - 1 ? `1px solid ${C.fondClair}` : "none",
                }}>
                  <div style={{
                    width: 30, height: 30, borderRadius: "50%", background: C.green + "18",
                    border: `2px solid ${C.green}`, display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 13, fontWeight: 800, color: C.green, flexShrink: 0,
                    fontFamily: "'Poppins', sans-serif",
                  }}>{i + 1}</div>
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 14, fontWeight: 700 }}>{s.step}</span>
                      <span style={{ fontSize: 11, color: C.muted }}>~{s.time}</span>
                    </div>
                    <div style={{ fontSize: 13, color: C.muted, marginTop: 3, lineHeight: 1.5 }}>{s.detail}</div>
                  </div>
                </div>
              ))}
            </Section>

            {/* Pliage */}
            <Section title="Pliage — 6 étapes (18 min)" icon="📦">
              {pliageSteps.map((s, i) => (
                <div key={i} style={{
                  display: "flex", gap: 12, padding: "10px 0",
                  borderBottom: i < pliageSteps.length - 1 ? `1px solid ${C.fondClair}` : "none",
                }}>
                  <div style={{
                    width: 30, height: 30, borderRadius: "50%", background: C.amber + "18",
                    border: `2px solid ${C.amber}`, display: "flex", alignItems: "center", justifyContent: "center",
                    fontSize: 13, fontWeight: 800, color: C.amber, flexShrink: 0,
                    fontFamily: "'Poppins', sans-serif",
                  }}>{i + 1}</div>
                  <div>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontSize: 14, fontWeight: 700 }}>{s.step}</span>
                      <span style={{ fontSize: 11, color: C.muted }}>~{s.time}</span>
                    </div>
                    <div style={{ fontSize: 13, color: C.muted, marginTop: 3, lineHeight: 1.5 }}>{s.detail}</div>
                  </div>
                </div>
              ))}
              <div style={{
                marginTop: 10, padding: "10px 14px", borderRadius: 10,
                background: C.corail + "12", borderLeft: `3px solid ${C.corail}`,
                fontSize: 13, fontWeight: 600, color: C.corail,
              }}>
                ⚠ Ne jamais arracher la toile contre les entretoises — cela provoque des déchirures qui nécessitent plusieurs heures de réparation.
              </div>
            </Section>

            {/* Video link placeholder */}
            <div style={{
              background: C.white, borderRadius: 14, padding: 20, border: `1px solid ${C.border}`,
              textAlign: "center",
            }}>
              <div style={{ fontSize: 40, marginBottom: 8 }}>🎥</div>
              <div style={{ fontSize: 16, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 6 }}>
                Vidéo tutoriel
              </div>
              <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
                Regardez notre vidéo de montage et pliage réalisée par l'équipe CPM
              </div>
              <div style={{
                padding: "10px 20px", borderRadius: 10, background: C.corail, color: "#fff",
                fontSize: 14, fontWeight: 600, display: "inline-block", cursor: "pointer",
              }}>
                ▶ Voir la vidéo sur Stream
              </div>
            </div>
          </div>
        )}

        {activeTab === "signaler" && (
          <div>
            {!signalSent ? (
              <div style={{ background: C.white, borderRadius: 14, padding: 20, border: `1px solid ${C.border}` }}>
                <div style={{ fontSize: 17, fontWeight: 700, fontFamily: "'Poppins', sans-serif", marginBottom: 6 }}>
                  Signaler un problème
                </div>
                <div style={{ fontSize: 14, color: C.muted, marginBottom: 16, lineHeight: 1.6 }}>
                  Un souci avec cette tente ? Aidez-nous à l'améliorer en nous le signalant. Votre retour est précieux pour nos équipes.
                </div>

                {/* Type selection */}
                <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 8, color: C.corail }}>Type de problème</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 16 }}>
                  {["Déchirure", "Pièce manquante", "Fermeture cassée", "Humidité / Moisissure", "Sardine tordue", "Autre"].map((type, i) => (
                    <button key={i} onClick={() => setShowSignal(type)} style={{
                      padding: "8px 14px", borderRadius: 20, cursor: "pointer",
                      border: showSignal === type ? `2px solid ${C.corail}` : `1px solid ${C.border}`,
                      background: showSignal === type ? C.corail + "12" : C.white,
                      color: showSignal === type ? C.corail : C.text,
                      fontSize: 13, fontWeight: 500,
                    }}>{type}</button>
                  ))}
                </div>

                {showSignal && (
                  <div>
                    {/* Photo upload */}
                    <div style={{
                      border: `2px dashed ${C.border}`, borderRadius: 12, padding: "20px",
                      textAlign: "center", marginBottom: 16, background: C.fondClair,
                    }}>
                      <div style={{ fontSize: 28, marginBottom: 6 }}>📸</div>
                      <div style={{ fontSize: 13, color: C.muted }}>Appuyez pour prendre une photo du problème</div>
                    </div>

                    {/* Comment */}
                    <div style={{
                      padding: "12px 14px", borderRadius: 10, border: `1px solid ${C.border}`,
                      fontSize: 14, color: C.muted, marginBottom: 16, minHeight: 80,
                      background: C.white,
                    }}>
                      Décrivez le problème en quelques mots...
                    </div>

                    {/* Send button */}
                    <button onClick={() => setSignalSent(true)} style={{
                      width: "100%", padding: "14px", borderRadius: 12, border: "none",
                      background: C.corail, color: "#fff", fontSize: 16, fontWeight: 700,
                      cursor: "pointer", fontFamily: "'Poppins', sans-serif",
                    }}>
                      Envoyer le signalement
                    </button>
                  </div>
                )}
              </div>
            ) : (
              <div style={{
                background: C.white, borderRadius: 14, padding: 30, border: `1px solid ${C.border}`,
                textAlign: "center",
              }}>
                <div style={{ fontSize: 50, marginBottom: 12 }}>✅</div>
                <div style={{ fontSize: 20, fontWeight: 700, fontFamily: "'Poppins', sans-serif", color: C.green, marginBottom: 8 }}>
                  Merci pour votre signalement !
                </div>
                <div style={{ fontSize: 14, color: C.muted, lineHeight: 1.6, marginBottom: 16 }}>
                  Notre équipe a été notifiée. Votre retour nous aide à maintenir notre matériel en excellent état pour tous les utilisateurs.
                </div>
                <div style={{ fontSize: 13, color: C.corail, fontWeight: 600 }}>
                  Tente {tent.type} #{tent.id} · Signalement envoyé
                </div>
                <button onClick={() => { setSignalSent(false); setShowSignal(false); }} style={{
                  marginTop: 16, padding: "10px 20px", borderRadius: 10,
                  border: `1px solid ${C.border}`, background: C.white,
                  fontSize: 14, cursor: "pointer", color: C.text,
                }}>Nouveau signalement</button>
              </div>
            )}
          </div>
        )}
      </div>

      {/* Footer */}
      <div style={{
        padding: "16px 20px", borderTop: `1px solid ${C.border}`, background: C.white,
        textAlign: "center",
      }}>
        <div style={{ fontSize: 11, color: C.muted, lineHeight: 1.6 }}>
          Centre de Prêt de Matériel — Fédération Wallonie-Bruxelles
        </div>
        <div style={{ fontSize: 10, color: C.border, marginTop: 4 }}>
          Un bien n'a de valeur que lorsqu'il est utilisé au service de l'intérêt général.
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(DigitalPassport));
    </script>
</body>
</html>
